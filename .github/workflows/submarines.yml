name: Submarines build

# Compiles Submarines.dll against the real game assemblies and packages it ready to install.
# The game assemblies come from the free Nuclear Option dedicated server (Steam app 3930080,
# anonymous login), the same approach other open-source Nuclear Option mods use in CI.
#
# Every branch build commits the DLL and zip to Submarines/release/ (pushes made with the
# workflow token don't trigger another run) and uploads the zip as a workflow artifact. Pushing a tag named submarines-v* also
# publishes a GitHub Release with that zip attached.

on:
  push:
    paths:
      - "Submarines/**"
      - ".github/workflows/submarines.yml"
    tags:
      - "submarines-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: submarines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache game assemblies
        id: cache-managed
        uses: actions/cache@v4
        with:
          path: ~/nomod-managed
          key: nomod-managed-${{ github.run_id }}
          restore-keys: nomod-managed-

      - name: Install SteamCMD
        if: steps.cache-managed.outputs.cache-hit != 'true'
        run: |
          sudo add-apt-repository -y multiverse
          sudo dpkg --add-architecture i386
          sudo apt-get update
          echo steam steam/question select "I AGREE" | sudo debconf-set-selections
          echo steam steam/license note '' | sudo debconf-set-selections
          sudo apt-get install -y steamcmd
          steamcmd +login anonymous +quit || true

      - name: Download Nuclear Option dedicated server
        if: steps.cache-managed.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/NuclearOptionServer"
          managed="$install_dir/NuclearOptionServer_Data/Managed"
          for attempt in 1 2 3; do
            echo "SteamCMD attempt $attempt"
            steamcmd +force_install_dir "$install_dir" +login anonymous +app_info_update 1 \
              +app_update 3930080 validate +quit || true
            if [[ -f "$managed/Assembly-CSharp.dll" ]]; then break; fi
            rm -rf "$HOME/Steam/appcache" "$HOME/.steam/appcache" "$HOME/.local/share/Steam/appcache" \
                   "$install_dir/steamapps/appmanifest_3930080.acf"
          done
          if [[ ! -f "$managed/Assembly-CSharp.dll" ]]; then
            echo "::error::SteamCMD failed to install app 3930080"
            exit 1
          fi
          mkdir -p "$HOME/nomod-managed"
          cp -r "$managed/." "$HOME/nomod-managed/"

      - name: Download BepInEx 5 core assemblies
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bepinex.zip" \
            https://github.com/BepInEx/BepInEx/releases/download/v5.4.23.4/BepInEx_win_x64_5.4.23.4.zip
          mkdir -p "$RUNNER_TEMP/bepinex"
          unzip -q "$RUNNER_TEMP/bepinex.zip" -d "$RUNNER_TEMP/bepinex"

      - name: Reconstruct game layout
        run: |
          game="$RUNNER_TEMP/game"
          mkdir -p "$game/NuclearOption_Data/Managed" "$game/BepInEx/core"
          cp -r "$HOME/nomod-managed/." "$game/NuclearOption_Data/Managed/"
          cp "$RUNNER_TEMP/bepinex/BepInEx/core/BepInEx.dll" "$game/BepInEx/core/"
          cp "$RUNNER_TEMP/bepinex/BepInEx/core/0Harmony.dll" "$game/BepInEx/core/"
          echo "NuclearOptionRoot=$game" >> "$GITHUB_ENV"
          ls "$game/NuclearOption_Data/Managed" | grep -E "^(Assembly-CSharp|Mirage|UnityEngine\.(CoreModule|PhysicsModule|IMGUIModule|InputLegacyModule|ParticleSystemModule))\.dll$"

      - name: Build
        run: dotnet build Submarines/Submarines.csproj -c Release -p:NuclearOptionRoot="$NuclearOptionRoot" -p:DeployToGame=false

      - name: Verify Harmony patches against the game
        run: dotnet run --project Submarines/tools/patchcheck/PatchCheck.csproj -c Release -- "$NuclearOptionRoot" Submarines/bin/Release/Submarines.dll

      - name: Package
        id: pkg
        run: |
          set -euo pipefail
          ver=$(grep -oP '<Version>\K[^<]+' Submarines/Submarines.csproj)
          out="$RUNNER_TEMP/pkg"
          mkdir -p "$out/BepInEx/plugins/Submarines"
          cp Submarines/bin/Release/Submarines.dll "$out/BepInEx/plugins/Submarines/"
          cp Submarines/README.md "$out/BepInEx/plugins/Submarines/README.md"
          cp Submarines/INSTALL.txt "$out/INSTALL.txt"
          (cd "$out" && zip -qr "$GITHUB_WORKSPACE/Submarines-$ver.zip" .)
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          sha256sum Submarines/bin/Release/Submarines.dll

      - name: Commit prebuilt DLL to the branch
        if: github.ref_type == 'branch'
        run: |
          set -euo pipefail
          mkdir -p Submarines/release
          cp Submarines/bin/Release/Submarines.dll Submarines/release/Submarines.dll
          cp "Submarines-${{ steps.pkg.outputs.ver }}.zip" Submarines/release/Submarines.zip
          (cd Submarines/release && sha256sum Submarines.dll Submarines.zip > SHA256SUMS.txt)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Submarines/release
          if git diff --cached --quiet; then
            echo "Prebuilt DLL unchanged."
          else
            git commit -m "Submarines: prebuilt DLL ${{ steps.pkg.outputs.ver }} from ${GITHUB_SHA::7}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Submarines-${{ steps.pkg.outputs.ver }}
          path: Submarines-${{ steps.pkg.outputs.ver }}.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/submarines-v')
        uses: softprops/action-gh-release@v2
        with:
          files: Submarines-${{ steps.pkg.outputs.ver }}.zip
          body: |
            Drop-in build of the Submarines mod for Nuclear Option (BepInEx 5).
            Unzip into the Nuclear Option game folder. See INSTALL.txt.
            Built with substantial AI assistance (Claude Code).
